name: smart_elderly_care_mobile
description: 智慧养老平台 Flutter 客户端
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  # 须使用仓库内 path 版本：已补全 Android `namespace`，兼容 AGP 8+；pub.dev 上 3.0.0 无 namespace 会导致 :amap_flutter_location 配置失败
  amap_flutter_base:
    path: packages/amap_flutter_base
  amap_flutter_location:
    path: packages/amap_flutter_location
  amap_flutter_map:
    path: packages/amap_flutter_map
  vibration: ^3.1.8
  flutter_ringtone_player: ^4.0.0+4
  geolocator: ^14.0.1
  sensors_plus: ^6.1.1
  image_picker: ^1.1.2
  crop_your_image: ^2.0.0
  image: ^4.5.4
  table_calendar: ^3.1.3
  record: ^6.2.0
  web_socket_channel: ^3.0.3
  crypto: ^3.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
