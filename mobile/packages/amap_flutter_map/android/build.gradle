group 'com.amap.flutter.amap_flutter_map'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.amap.flutter.amap_flutter_map'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    compileOnly 'com.amap.api:3dmap:8.1.0'
}

