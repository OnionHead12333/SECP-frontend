group 'com.amap.flutter.amap_flutter_location'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.amap.flutter.location'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'com.amap.api:location:5.6.0'
}
