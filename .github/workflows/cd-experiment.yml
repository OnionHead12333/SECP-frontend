name: Frontend APK Release Experiment

on:
  push:
    tags:
      - "frontend-release-*"

permissions:
  contents: write

concurrency:
  group: frontend-apk-release
  cancel-in-progress: false

jobs:
  build-release-apk:
    name: Analyze, Test, Build and Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FLUTTER_VERSION: "3.41.6"
      APK_SOURCE: mobile/build/app/outputs/flutter-apk/app-debug.apk
      RELEASE_APK: release/secp-frontend-${{ github.ref_name }}-debug.apk
      RELEASE_SHA256: release/secp-frontend-${{ github.ref_name }}-debug.apk.sha256
      RELEASE_NOTES: release/release-notes.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit source
        run: |
          git fetch --no-tags origin main
          RELEASE_COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor \
            "$RELEASE_COMMIT" \
            origin/main
          printf 'RELEASE_COMMIT=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Show tool versions
        working-directory: mobile
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Static analysis
        working-directory: mobile
        run: |
          flutter analyze \
            --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Run tests
        working-directory: mobile
        run: flutter test --no-pub

      - name: Prepare Gradle wrapper
        working-directory: mobile
        run: chmod +x android/gradlew

      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug --no-pub

      - name: Prepare release files
        run: |
          test -f "$APK_SOURCE"
          test -s "$APK_SOURCE"

          install -d release
          cp "$APK_SOURCE" "$RELEASE_APK"

          RELEASE_APK_NAME="$(basename "$RELEASE_APK")"
          (
            cd release
            sha256sum "$RELEASE_APK_NAME" > "${RELEASE_APK_NAME}.sha256"
            sha256sum -c "${RELEASE_APK_NAME}.sha256"
          )

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf '%s\n' '这是内部测试版 Debug APK。'
            printf '\n'
            printf -- '- 标签名称：`%s`\n' "$GITHUB_REF_NAME"
            printf -- '- 源提交：`%s`\n' "$RELEASE_COMMIT"
            printf -- '- Flutter 版本：`%s`\n' "$FLUTTER_VERSION"
            printf -- '- 安装前需要允许安装未知来源应用。\n'
            printf -- '- 这不是应用商店正式签名版本。\n'
          } > "$RELEASE_NOTES"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "SECP Frontend Test APK ${GITHUB_REF_NAME}" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease
            gh release upload "$GITHUB_REF_NAME" \
              "$RELEASE_APK" \
              "$RELEASE_SHA256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RELEASE_APK" \
              "$RELEASE_SHA256" \
              --verify-tag \
              --title "SECP Frontend Test APK ${GITHUB_REF_NAME}" \
              --notes-file "$RELEASE_NOTES" \
              --prerelease
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: secp-frontend-debug-apk-${{ github.ref_name }}
          path: |
            release/secp-frontend-${{ github.ref_name }}-debug.apk
            release/secp-frontend-${{ github.ref_name }}-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
